name: .NET and Angular CI/CD Pipeline

# Controls when the workflow will run
on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

# Environment variables available to all jobs and steps
env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository_owner }}/race-app-api
  IMAGE_NAME_FRONTEND: ${{ github.repository_owner }}/race-app-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Match your project's .NET version

      - name: Restore, Build, and Test .NET Project
        run: |
          dotnet restore ./backend/microservices/teammanagement-service/TeamManagementService.sln
          dotnet build ./backend/microservices/teammanagement-service/TeamManagementService.sln --no-restore --configuration Release
          dotnet test ./backend/microservices/teammanagement-service/TeamManagementService.sln --no-build --verbosity normal

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Match your project's Node.js version

      - name: Install and Build Angular Project
        run: |
          npm install --prefix frontend
          npm run build --prefix frontend -- --configuration production

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for API
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/microservices/teammanagement-service/TeamManagementService.API/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}

      - name: Extract Docker metadata for Frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile # Assumes this Dockerfile exists
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
