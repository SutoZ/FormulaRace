<mat-card>
  <mat-card-title>Create New Pilot</mat-card-title>
  <mat-card-content>
    <form [formGroup]="createPilotForm" (ngSubmit)="onSubmit()" novalidate>
      <!-- Name -->
      <mat-form-field appearance="fill">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" required />
        <mat-error *ngIf="createPilotForm.get('name')?.hasError('required')">
          Name is required.
        </mat-error>
      </mat-form-field>

      <!-- Number -->
      <mat-form-field appearance="fill">
        <mat-label>Number</mat-label>
        <input matInput type="number" formControlName="number" required />
        <mat-error *ngIf="createPilotForm.get('number')?.hasError('required')">
          Number is required.
        </mat-error>
        <mat-error *ngIf="createPilotForm.get('number')?.hasError('pattern')">
          Please enter a valid number.
        </mat-error>
      </mat-form-field>

      <!-- Code -->
      <mat-form-field appearance="fill">
        <mat-label>Code</mat-label>
        <input matInput formControlName="code" required maxlength="3" />
        <mat-hint align="end">{{ createPilotForm.get('code')?.value?.length || 0 }}/3</mat-hint>
        <mat-error *ngIf="createPilotForm.get('code')?.hasError('required')">
          Code is required.
        </mat-error>
        <mat-error
          *ngIf="createPilotForm.get('code')?.hasError('minlength') || createPilotForm.get('code')?.hasError('maxlength')"
        >
          Code must be exactly 3 characters.
        </mat-error>
      </mat-form-field>

      <!-- Nationality -->
      <mat-form-field appearance="fill">
        <mat-label>Nationality</mat-label>
        <input matInput formControlName="nationality" required />
        <mat-error *ngIf="createPilotForm.get('nationality')?.hasError('required')">
          Nationality is required.
        </mat-error>
      </mat-form-field>

      <!-- Team -->
      <mat-form-field appearance="fill">
        <mat-label>Team</mat-label>
        <mat-select formControlName="teamId" required>
          <mat-option *ngFor="let team of teams" [value]="team.id"> {{ team.name }} </mat-option>
        </mat-select>
        <mat-error *ngIf="createPilotForm.get('teamId')?.hasError('required')">
          Team is required.
        </mat-error>
      </mat-form-field>
    </form>
  </mat-card-content>
  <mat-card-actions align="end">
    <button mat-button routerLink="/pilots">Cancel</button>
    <button
      mat-raised-button
      color="primary"
      (click)="onSubmit()"
      [disabled]="createPilotForm.invalid"
    >
      Create Pilot
    </button>
  </mat-card-actions>
</mat-card>
