apiVersion: apps/v1
kind: Deployment
metadata:
  # Best Practice: Use a descriptive name for your deployment.
  name: api-deployment
  labels:
    app: api
    tier: backend
spec:
  # Best Practice: Run at least 2-3 replicas for high availability in production.
  replicas: 3
  selector:
    # This must match the labels in the pod template below.
    matchLabels:
      app: api
  # Best Practice: Define a deployment strategy for zero-downtime updates.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable: How many pods can be down during an update.
      # maxSurge: How many extra pods can be created during an update.
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      # Best Practice: Label your pods for service discovery and organization.
      labels:
        app: api
        tier: backend
    spec:
      containers:
        - name: api-container
          # Best Practice: Use a specific image tag, not 'latest'.
          # Replace 'your-registry/formula-race-api:v1.0.0' with your actual image path.
          image: your-registry/formula-race-api:v1.0.0
          # Best Practice: Always define resource requests and limits.
          # This prevents one container from starving others and improves scheduling.
          resources:
            requests:
              memory: '256Mi' # Guaranteed memory
              cpu: '250m' # Guaranteed CPU (0.25 of a core)
            limits:
              memory: '512Mi' # Maximum memory
              cpu: '500m' # Maximum CPU (0.5 of a core)
          ports:
            # The port your application listens on inside the container.
            - containerPort: 8080
          # Best Practice: Use environment variables to manage configuration.
          env:
            # Best Practice: Store secrets in Kubernetes Secrets, not plain text.
            # You must create a secret named 'api-secret' with a key 'DB_PASSWORD'.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: DB_PASSWORD
            # Best Practice: Store non-sensitive config in a ConfigMap.
            # You must create a ConfigMap named 'api-config' with the following keys.
            - name: ASPNETCORE__ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE__URLS
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: ASPNETCORE_URLS
            - name: Seq__ServerUrl
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: Seq_ServerUrl
            - name: ConnectionStrings__RaceConnection
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: RaceConnection
          # Best Practice: Configure readiness probes to ensure traffic is only sent to healthy pods.
          readinessProbe:
            httpGet:
              path: /healthz # Your health check endpoint
              port: 8080
            initialDelaySeconds: 15 # How long to wait before the first probe
            periodSeconds: 10 # How often to probe
          # Best Practice: Configure liveness probes to restart unhealthy containers automatically.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
