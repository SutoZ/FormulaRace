apiVersion: v1
kind: Service
metadata:
  name: team-management-service
spec:
  type: LoadBalancer # Exposes the service externally using a cloud provider's load balancer
  selector:
    app: team-management-service # This must match the labels in your Deployment
  ports:
    - protocol: TCP
      port: 80 # The port the service will be available on
      nodePort: 30080 # The port on each node to expose the service on
      targetPort: 8080 # The port the container is listening on
  # Note: NodePort is useful for development and testing, but consider using LoadBalancer or Ingress for production environments
  # If you want to use LoadBalancer, change type to LoadBalancer and remove nodePort
  # If you want to use Ingress, you will need to set up an Ingress controller and define an Ingress resource
---
# This service definition allows you to access the team management service via http://<node-ip>:30080
# You can use kubectl port-forward to access it locally for testing:
# kubectl port-forward service/team-management-service 8080:80
